  text: |-
    Junior partner at a top AmLaw firm. Tags: QC + strategy, technically capable, career focused. Quote: "I make Jose look good." Daily tools: DISCO, MS Word, iManage, Relativity. Not the buyer; influences the decision through daily execution pain.
- id: D2
  tier: 4
  source: DISCO Board Education deck, speaker notes 2.6 (Steven)
  date: 2026-08
  url: null
  kind: synthesis
  verified: true
  topics:
    - role
    - workflow
    - coordination
    - budget-authority
  personas:
    - steven
  text: |-
    Steven sits at the intersection of strategy and execution — setting discovery scope, overseeing associate work product, owning the matter budget. He is who Jose turns to for a current read on the case and who juniors turn to for direction. When a client asks a question he pulls the answer together across associates, paralegals and drafts, then synthesises it for Jose or the client. If something is missed or contradicts what Jose already told the client, it surfaces on his watch — he is the single point of failure for keeping the picture whole. He values a defensible answer without a long chain between question and response; the more the stack fragments, the more his day fills with coordination instead of judgment. For adoption he matters more than any other practitioner: he feels the cost daily and manages the budget.
- id: D3
  tier: 4
  source: DISCO Board Education deck, speaker notes 3.1 (AI by persona — Steven)
  date: 2026-08
  url: null
  kind: synthesis
  verified: true
  topics:
