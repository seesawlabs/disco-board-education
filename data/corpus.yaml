    - ai-risk
    - trust
  personas:
    - steven
  text: |-
    AI gives Steven a faster starting point for status updates, but he owns the error if the synthesis is wrong — so a tool that is fast but occasionally inaccurate shifts more risk onto him, not less. Hallucinations are reputationally damaging.
- id: D4
  tier: 4
  source: DISCO Board Education deck, speaker notes 3.3 (The trust threshold)
  date: 2026-08
  url: null
  kind: synthesis
  verified: true
  topics:
    - trust
    - verification
    - ai-adoption
    - drafting
  personas:
    - steven
    - jose
    - bo
    - bill
  text: |-
    Verifiability is the dividing line for AI adoption. Adoption has happened where output traces back to identifiable source documents an attorney can check: document review and triage, timeline generation, witness and entity background research, case summarisation. It has not crossed into autonomous drafting of high-stakes filings, strategic case recommendations, settlement analysis, or anything a partner signs their name to — output that is judgment rather than retrieval, harder to verify, and consequential when wrong. The line moves as tools make output traceable and auditable. Platforms earn the next column by making output verifiable, not by leading with the most ambitious capability.
- id: D5
  tier: 4
  source: DISCO Board Education deck, speaker notes 2.11 (Buyers vs users)
  date: 2026-08
  url: null
  kind: synthesis
  verified: true
  topics:
    - procurement
    - buying
    - adoption
  personas:
    - steven
    - jose
    - bill
    - amanda
  text: |-
    The people making purchasing decisions are not the people doing the daily litigation work. Bill evaluates platforms on security, compliance, integration and ROI. Amanda evaluates outside-counsel tools on visibility, cost predictability and risk. Tanner, Bo and Steven work with whatever the firm has already deployed. A tool can dramatically improve daily work and still never get deployed unless it satisfies Bill's criteria — bottom-up enthusiasm does not override top-down procurement.
- id: D6
  tier: 4
  source: DISCO Board Education deck, slide 13 + notes 2.5 (Persona — Jose)
  date: 2026-08
  url: null
  kind: synthesis
  verified: true
  topics:
    - role
    - buying
    - trust
  personas:
    - jose
  text: |-
    Senior relationship partner, $1,800–2,200/hr, high stakes, reputation first. Quote: "I need to walk into that client meeting knowing every fact cold." Uses MS Word, Outlook, Westlaw; reviews only, rarely hands-on in the platform. Not the buyer, but his endorsement unlocks firm-wide adoption. His work is business development, high-level synthesis and decision-making. He expects accuracy and will not back a tool that introduces new risk into a process that already works. His fear is leaning on a summary that is incorrect and being surprised in front of the client. Speed is worth nothing if he cannot fully trust it.
- id: D7
  tier: 4
  source: DISCO Board Education deck, slide 12 + notes 2.4 (Persona — Bill)
  date: 2026-08
  url: null
  kind: synthesis
  verified: true
  topics:
    - role
    - procurement
    - security
    - build-vs-buy
  personas:
    - bill
  text: |-
    Technology operations lead at the firm. Not assigned to any individual matter but controls what technology the firm buys and deploys — the buyer on the firm side. Evaluates on security, compliance, integration and ROI. Every new AI vendor is another security surface and compliance question; in a build-versus-buy moment, committing the firm's budget and credibility to the wrong long-term platform is costly to unwind. Kirkland & Ellis committing roughly $500 million (about $100 million in 2026) to build a proprietary AI platform rather than license third-party tools sharpens that fear.
- id: D8
  tier: 4
  source: DISCO Board Education deck, speaker notes 3.2 (The insourcing movement)
  date: 2026-08
  url: null
  kind: synthesis
  verified: true
  topics:
    - economics
    - insourcing
    - market
  personas:
    - steven
    - jose
    - amanda
    - bill
  text: |-
    Litigation work is moving in-house on both sides. At firms the driver is margin: AI-assisted review lets smaller teams handle populations that once required large managed-review staffs or outsourcing. On the client side the driver is cost control and visibility, with legal departments under sustained CFO pressure to reduce outside-counsel spend. This does not mean corporate legal departments are replacing outside counsel for complex, high-stakes litigation — what changes is the distribution of work across the lifecycle.
